<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#011C40"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Sayeh Connect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: single phone-width column (max 480px) with a fixed bottom tab bar, as in the Sayeh Connect mockup. Navy + electric blue on cool white. */
:root{
  /* palette LUNA : #A7EBF2 #54ACBF #26658C #023859 #011C40 */
  --bg:#EAF8FA; --surface:#FFFFFF; --ink:#011C40; --muted:#356585; --line:#C5E6EC;
  --navy:#023859; --accent:#26658C; --accent-ink:#FFFFFF; --accent-soft:#D3F2F6; --accent-fg:#26658C;
  --teal:#26658C; --teal-soft:#CBEAF0;
  --ok:#1F8A55; --ok-soft:#DFF4E8; --warn:#8A5F10; --warn-soft:#FBEFD2; --bad:#B03A32; --bad-soft:#FBE3E0;
  --vio:#023859; --vio-soft:#D6E4EE;
  --hero-wall:#D7F0F4; --hero-floor:#9BC8D2;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Script",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#011C40; --surface:#023859; --ink:#E4F9FB; --muted:#8FCBD8; --line:#1D5578;
  --navy:#023859; --accent:#54ACBF; --accent-ink:#011C40; --accent-soft:#0B4A73; --accent-fg:#A7EBF2;
  --teal:#A7EBF2; --teal-soft:#0F5A80;
  --ok:#6FCB92; --ok-soft:#0F3D3A; --warn:#E3B55A; --warn-soft:#3A3516; --bad:#F08A80; --bad-soft:#3E2230;
  --vio:#A7EBF2; --vio-soft:#123F66; --hero-wall:#0B4A73; --hero-floor:#26658C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#011C40; --surface:#023859; --ink:#E4F9FB; --muted:#8FCBD8; --line:#1D5578;
  --navy:#023859; --accent:#54ACBF; --accent-ink:#011C40; --accent-soft:#0B4A73; --accent-fg:#A7EBF2;
  --teal:#A7EBF2; --teal-soft:#0F5A80;
  --ok:#6FCB92; --ok-soft:#0F3D3A; --warn:#E3B55A; --warn-soft:#3A3516; --bad:#F08A80; --bad-soft:#3E2230;
  --vio:#A7EBF2; --vio-soft:#123F66; --hero-wall:#0B4A73; --hero-floor:#26658C; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font-family:inherit}
.app{max-width:480px;margin:0 auto;min-width:0}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.logo{width:44px;height:44px;border-radius:24%;object-fit:cover;display:block;flex:none}
.logo.big{width:92px;height:92px}

/* splash */
.splash{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding-block:24px}
.splash h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.splash h1 span{color:var(--accent);display:block}
.splash .tag{color:var(--muted);max-width:260px;margin:4px 0 6px}
.hand{font:600 24px/1.15 var(--hand);color:var(--navy);transform:rotate(-3deg);margin:6px 0 18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hand{color:var(--accent)}}
:root[data-theme="dark"] .hand{color:var(--accent)}
.splash .btn{width:100%;max-width:340px}

body.sp{background:linear-gradient(165deg,#54ACBF 0%,#26658C 36%,#023859 68%,#011C40 100%) fixed}
.sp .splash h1{color:#FFFFFF}.sp .splash h1 span{color:#A7EBF2}.sp .splash .tag{color:#E4F9FB}.sp .hand{color:#A7EBF2}
.sp .btn.primary{background:#A7EBF2;color:#011C40;border-color:#A7EBF2}.sp .btn.link{color:#E4F9FB}
.sp .wm p{color:#E4F9FB}.sp .wm b{color:#FFFFFF}.sp .wm img{filter:brightness(1.9) contrast(.95)}
/* header + controls */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:18px 0 10px;flex-wrap:wrap}
.hello{display:flex;align-items:center;gap:10px;min-width:0}
.hello b{display:block;font-size:17px;font-weight:700}
.hello span{color:var(--muted);font-size:12px}
.pagehead{padding:20px 0 8px}
.pagehead h1{font-size:22px}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.zone{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.zone button{border:0;background:none;color:var(--muted);font:600 13px var(--display);padding:7px 14px;border-radius:99px;cursor:pointer}
.zone button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin:6px 0 12px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;background:none;color:var(--ink);padding:13px 0;font-size:14px;width:100%;outline:none}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button,.pills button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--display);padding:8px 14px;border-radius:99px;cursor:pointer}
.chips button[aria-pressed="true"],.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.job:focus-visible,.row-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* job list */
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.count{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.count h2{font-size:16px}
.count span{color:var(--muted);font-size:12px}
.job{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.job:hover{border-color:var(--accent)}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.v0{background:var(--accent-soft);color:var(--accent-fg)}.v1{background:var(--teal-soft);color:var(--teal)}.v2{background:var(--warn-soft);color:var(--warn)}.v3{background:var(--vio-soft);color:var(--vio)}
.job-t{font-weight:700;font-size:14.5px;line-height:1.3}
.job-m{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;margin-top:2px;min-width:0}
.job-m svg{width:13px;height:13px;flex:none}
.job-m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-new{background:var(--ok-soft);color:var(--ok)}.b-pop{background:var(--bad-soft);color:var(--bad)}.b-rem{background:var(--accent-soft);color:var(--accent-fg)}.b-ex{background:var(--warn-soft);color:var(--warn)}
.bm{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:grid}
.bm svg{width:22px;height:22px}
.bm[aria-pressed="true"]{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:14px;margin-bottom:10px}

/* detail */
.dbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.icbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icbtn svg{width:20px;height:20px}
.icbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.hero{border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
.hero svg{display:block;width:100%;height:auto}
.d-title{font-size:21px;line-height:1.25;margin-bottom:4px}
.d-co{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;margin-bottom:6px}
.d-co .av{width:26px;height:26px;border-radius:8px;font-size:11px}
.d-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:10px}
.d-meta span{display:flex;align-items:center;gap:5px}.d-meta svg{width:15px;height:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.d-h{font-size:15px;margin:18px 0 6px}
.d-p{color:var(--muted);margin:0}
ul.req{margin:0;padding-inline-start:20px;color:var(--muted)}
ul.req li{margin-bottom:3px}
.warn{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px}
.applied{background:var(--ok-soft);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:13px;color:var(--ink)}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cta-in{max-width:480px;margin:0 auto;display:flex;gap:8px}
.cta .btn{flex:1}
.cta .btn.sq{flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--display);padding:13px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.link{border:0;background:none;color:var(--accent);padding:8px}
.btn.sm{font-size:13px;padding:8px 12px;border-radius:10px;font-weight:600}
.btn[aria-disabled="true"],.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* cards + forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;min-width:0}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.row>*{min-width:0}
.title{font-weight:700;font-size:14.5px}
.meta{color:var(--muted);font-size:12.5px}
.how{font-size:13px;color:var(--muted);margin:6px 0 8px}
.how b{color:var(--ink);font-weight:700}
.chip{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-fg);font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.grid .full{grid-column:1/-1}
@media (max-width:420px){form.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.reminder{background:var(--warn-soft);border-radius:12px;padding:8px 10px;font-size:12.5px;margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sites{display:grid;gap:10px}
.site{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:8px;align-items:start}
.site a{color:var(--accent);font-weight:700;word-break:break-word}
@media (max-width:420px){.site{grid-template-columns:1fr;gap:0}}
h2.sec{font-size:15px;margin:18px 0 8px}

/* profile */
.me{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:22px 0 14px}
.me .big-av{width:76px;height:76px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px;margin-bottom:8px}
.me b{font-size:17px}.me span{color:var(--muted);font-size:13px}
.prog{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.row-link{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:600 14px var(--display);padding:14px;cursor:pointer;text-align:start}
.row-link:last-child{border-bottom:0}
.row-link svg{width:20px;height:20px;color:var(--muted);flex:none}
.row-link .grow{flex:1;min-width:0}
.row-link .chev{width:16px;height:16px}
.panel{padding:12px 14px 14px;border-bottom:1px solid var(--line);background:var(--bg)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--display);padding:6px 0;cursor:pointer;border-radius:10px}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:40;max-width:90vw;text-align:center}
.wm{display:flex;flex-direction:column;align-items:center;gap:8px;margin:30px 0 6px;text-align:center}
.wm img{width:118px;height:auto;opacity:.85}
.wm p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5;max-width:290px}
.wm b{color:var(--ink);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wm img{filter:brightness(1.9) contrast(.95)}}
:root[data-theme="dark"] .wm img{filter:brightness(1.9) contrast(.95)}
@media (prefers-reduced-motion:no-preference){.job,.btn{transition:border-color .15s,transform .1s}.btn:active{transform:scale(.98)}}
</style>

</head><body>

  shown.forEach(function(c){
    var d=dueInfo(c),cls=c.status==="replied"||c.status==="interview"?"ok":c.status==="rejected"?"bad":"";
    h+='<article class="card" data-id="'+c.id+'"><div class="row"><div><div class="title">'+esc(c.name)+'</div><div class="meta">'+esc(c.country||"—")+(c.phone?' · <span dir="ltr">'+esc(c.phone)+'</span>':'')+'</div></div><span class="chip '+cls+'">'+STATUS[c.status]+'</span></div>'
     +(c.offer?'<div class="how"><b>Offre :</b> '+esc(c.offer)+'</div>':'')+(c.notes?'<div class="how">'+esc(c.notes)+'</div>':'')
     +'<div class="meta">Enregistré le <span dir="ltr">'+fmt(c.created)+'</span>'+(c.followups?' · relances : '+c.followups:'')+(c.statusAt?' · mis à jour le <span dir="ltr">'+fmt(c.statusAt)+'</span>':'')+'</div>';
    if(d)h+='<div class="reminder"><span>'+(d.archive?'Deux relances sans réponse. Vous pouvez archiver.':d.days+' jours sans réponse. C\'est le moment de relancer.')+'</span>'+(d.archive?'<button class="btn sm" data-act="archive">Archiver</button>':'<button class="btn sm primary" data-act="followup">J\'ai relancé</button>')+'</div>';
    h+='<div class="btns" style="margin-top:10px"><select data-act="status" aria-label="Statut" style="width:auto">'+Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(k===c.status?' selected':'')+'>'+STATUS[k]+'</option>'}).join("")+'</select><button class="btn sm" data-act="tpl">Écrire</button><button class="btn sm" data-act="del">Supprimer</button></div></article>';
  });
  return h;
}
function fillTpl(){
  var t=TPL[ui.tplLang][ui.tplKey];
  var map={me:state.profile.name||"[Votre nom]",contact:ui.tplContactName||(ui.tplLang==="fr"?"Madame, Monsieur":"Sir or Madam"),company:ui.tplCompany||"[Entreprise]",role:ui.tplRole||"[Poste]"};
  function sub(x){return x.replace(/\{(\w+)\}/g,function(_,k){return map[k]})}
  return {s:sub(t.s),b:sub(t.b)};
}
function tplHtml(){
  var h='<div class="card"><form class="grid" onsubmit="return false"><div><label for="t-contact">Nom du contact</label><input id="t-contact" value="'+esc(ui.tplContactName)+'"></div><div><label for="t-company">Entreprise</label><input id="t-company" value="'+esc(ui.tplCompany)+'"></div><div class="full"><label for="t-role">Poste</label><input id="t-role" value="'+esc(ui.tplRole)+'"></div></form></div>';
  h+='<div class="pills">'+["fr","en"].map(function(l){return '<button data-lang="'+l+'" aria-pressed="'+(ui.tplLang===l)+'">'+(l==="fr"?"Français":"English")+'</button>'}).join("")+'</div>';
  h+='<div class="chips">'+Object.keys(TPL.fr).map(function(k){return '<button data-key="'+k+'" aria-pressed="'+(ui.tplKey===k)+'">'+TPL.fr[k].n+'</button>'}).join("")+'</div>';
  h+='<div class="card"><label for="t-subject">Objet</label><input id="t-subject" readonly><div style="height:10px"></div><label for="t-body">Message</label><textarea id="t-body" readonly></textarea><div class="btns" style="margin-top:10px"><button class="btn primary sm" id="copyBody">Copier le message</button><button class="btn sm" id="copySubject">Copier l\'objet</button></div></div>';
  return h;
}
function viewProfile(){
  var p=state.profile,pct=profileScore();
  var h='<div class="me"><div class="big-av">'+esc(initials(p.name||"?"))+'</div><b>'+esc(p.name||"Votre nom")+'</b><span>'+esc(p.title||"Votre métier")+'</span></div>';
  h+='<div class="card"><div class="row"><b>Mon profil</b><span class="meta">'+pct+'%</span></div><div class="prog" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div></div>';
  function rowBtn(k,icn,label){return '<button class="row-link" data-open-sec="'+k+'">'+ic(icn)+'<span class="grow">'+label+'</span>'+ic("chev").replace('<svg','<svg class="chev"')+'</button>'}
  h+='<div class="menu">';
  h+=rowBtn("info","user","Mes informations");
  if(ui.open==="info")h+='<div class="panel"><form class="grid" onsubmit="return false"><div><label for="p-name">Nom</label><input id="p-name" value="'+esc(p.name)+'"></div><div><label for="p-title">Métier</label><input id="p-title" value="'+esc(p.title)+'"></div><div><label for="p-city">Ville</label><input id="p-city" value="'+esc(p.city)+'"></div><div><label for="p-phone">Téléphone</label><input id="p-phone" value="'+esc(p.phone)+'"></div><div class="full"><label for="p-email">E-mail</label><input id="p-email" type="email" value="'+esc(p.email)+'"></div></form></div>';
  h+=rowBtn("cv","file","Mon CV et mon portfolio");
  if(ui.open==="cv")h+='<div class="panel"><form class="grid" onsubmit="return false"><div class="full"><label for="p-portfolio">Lien du portfolio</label><input id="p-portfolio" type="url" placeholder="https://" value="'+esc(p.portfolio)+'"></div><div class="full"><label for="p-cv">Lien du CV (PDF)</label><input id="p-cv" type="url" placeholder="https://" value="'+esc(p.cv)+'"></div></form></div>';
  h+=rowBtn("apps","chat","Mes candidatures");
  h+=rowBtn("favs","heart","Mes favoris");
  h+=rowBtn("set","sliders","Paramètres");
  if(ui.open==="set")h+='<div class="panel"><label for="s-remind">Relancer après</label><select id="s-remind">'+[3,5,7,10].map(function(n){return '<option value="'+n+'"'+(n===state.remind?' selected':'')+'>'+n+' jours sans réponse</option>'}).join("")+'</select><div style="height:12px"></div><button class="btn sm" data-notif="1">Activer les notifications</button><p class="meta" style="margin:8px 0 0">Vous recevez une alerte quand de nouvelles offres apparaissent à l\'ouverture de l\'application.</p></div>';
  h+='</div>';
  return h;
}
function wmHtml(){return '<footer class="wm"><img src="'+WM+'" alt="Sayeh Designs"><p>Sayeh Connect est l\'une des applications de <b>Sayeh Designs</b>. Toutes nos applications portent cette même signature.</p></footer>'}
function viewSplash(){
  return '<div class="splash"><img class="logo big" alt="" src="'+LOGO+'"><h1>Sayeh<span>Connect</span></h1><p class="tag">Votre passerelle vers de nouvelles opportunités.</p><div class="hand">Un nouvel emploi,<br>une nouvelle étape</div><button class="btn primary" data-start="1">Commencer</button><button class="btn link" data-start="1">Se connecter</button>'+wmHtml()+'</div>';
}
function chromeHtml(){
  if(ui.view==="splash"||ui.view==="detail")return "";
  var T=[["home","home","Accueil"],["fav","heart","Favoris"],["msg","chat","Messages"],["profile","user","Profil"]];
  return '<nav class="tabs" aria-label="Navigation"><div class="tabs-in">'+T.map(function(t){return '<button data-nav="'+t[0]+'"'+(ui.view===t[0]?' aria-current="page"':'')+'>'+ic(t[1],ui.view===t[0]&&t[0]==="fav")+t[2]+'</button>'}).join("")+'</div></nav>';
}
function render(){
  var v=ui.view,h="";
  if(v==="splash")h=viewSplash();
  else if(v==="home")h=viewHome();
  else if(v==="fav")h=viewFav();
  else if(v==="detail")h=viewDetail();
  else if(v==="msg")h=viewMsg();
  else if(v==="profile")h=viewProfile();
  var keepQ=(v==="home"&&document.activeElement&&document.activeElement.id==="q");
  document.body.classList.toggle("sp",v==="splash");
  $("app").innerHTML=h+(v==="splash"?"":wmHtml());$("chrome").innerHTML=chromeHtml();
  if(v==="msg"&&ui.msgTab==="tpl")refreshTpl();
  if(keepQ){var q=$("q");q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
function go(view,extra){
  if(extra)for(var k in extra)ui[k]=extra[k];
  ui.view=view;render();window.scrollTo(0,0);
}
function refreshTpl(){var f=fillTpl(),s=$("t-subject"),b=$("t-body");if(s)s.value=f.s;if(b)b.value=f.b}
function copyText(txt,el){
  function fallback(){el.focus();el.select();try{document.execCommand("copy");toast("Copié")}catch(e){toast("Sélectionnez le texte et copiez-le")}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Copié")},fallback)}else fallback();
}
function toggleFav(id){
  var i=-1;state.favs.forEach(function(f,k){if(f.id===id)i=k});
  if(i>=0)state.favs.splice(i,1);else{var o=offerById(id);if(o)state.favs.push(JSON.parse(JSON.stringify(o)))}
  persist();
}

/* ---------- offres réelles, ajout manuel, notifications ---------- */
function noteHtml(){
  if(mode==="demo")return '<div class="note"><b>Mode démo.</b> Les offres affichées sont des exemples. Les offres réelles apparaissent quand l\'application est hébergée avec son serveur.</div>';
  var t=ui.updated?new Date(ui.updated):null;
  var h='<div class="note">Offres réelles'+(t?' · mises à jour à '+pad(t.getHours())+':'+pad(t.getMinutes()):'')+'. Sources : Adzuna, Arbeitnow, Remotive.';
  if(ui.zone==="tn")h+=' Pour la Tunisie, ouvrez les sites ci-dessous et ajoutez ici les offres qui vous intéressent.';
  return h+'</div>';
}
function manualHtml(){
  if(ui.zone!=="tn")return "";
  var h='<div class="btns" style="margin:4px 0 10px"><button class="btn sm" data-toggleman="1">'+(ui.manOpen?'Fermer':'+ Ajouter une offre trouvée')+'</button></div>';
  if(ui.manOpen)h+='<form id="manForm" class="grid card"><div class="full"><label for="m-t">Titre du poste</label><input id="m-t" required autocomplete="off"></div><div><label for="m-c">Entreprise</label><input id="m-c" required autocomplete="off"></div><div><label for="m-k">Ville</label><input id="m-k" autocomplete="off"></div><div class="full"><label for="m-u">Lien de l\'offre</label><input id="m-u" type="url" placeholder="https://" autocomplete="off"></div><div class="full"><label for="m-ct">Contrat</label><select id="m-ct"><option value="full">Temps plein</option><option value="part">Temps partiel</option><option value="free">Freelance</option></select></div><div class="full"><button class="btn primary" type="submit" style="width:100%">Ajouter à mes offres</button></div></form>';
  return h;
}
function addManual(){
  var o={id:"m"+uid(),z:"tn",manual:true,ct:$("m-ct").value,t:$("m-t").value.trim(),c:$("m-c").value.trim(),k:$("m-k").value.trim()||"Tunisie",url:$("m-u").value.trim(),s:85,mode:"Offre ajoutée par vous",lang:"voir l'annonce",how:"Postulez depuis le lien de l'offre ou par e-mail, avec votre CV et votre portfolio."};
  state.manual.unshift(o);ui.manOpen=false;persist();toast("Offre ajoutée");render();
}
function loadJobs(){
  var cached=null;
  try{cached=JSON.parse(localStorage.getItem("sc-jobs")||"null")}catch(e){}
  if(cached&&cached.jobs&&cached.jobs.length){live=cached.jobs;mode="live";ui.updated=cached.ts;rerenderSafe()}
  fetch("api/jobs").then(function(r){if(!r.ok)throw new Error("api");return r.json()}).then(function(d){
    if(!d.jobs||!d.jobs.length){if(!live.length)mode="demo";return}
    live=d.jobs;mode="live";ui.updated=Date.now();
    try{localStorage.setItem("sc-jobs",JSON.stringify({ts:ui.updated,jobs:live}))}catch(e){}
    rerenderSafe();notifyNew();
  }).catch(function(){if(!live.length){mode="demo";rerenderSafe()}});
}
function rerenderSafe(){var a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}
function notifyNew(){
  var ids=live.map(function(o){return o.id}),fresh=live.filter(function(o){return !o.scam&&state.seen.indexOf(o.id)<0});
  var firstRun=state.seen.length===0;
  state.seen=ids.concat(state.seen).slice(0,400);persist();
  if(firstRun||!fresh.length||!("Notification" in window)||Notification.permission!=="granted")return;
  var body=fresh.length+(fresh.length>1?" nouvelles offres":" nouvelle offre")+" : "+fresh[0].t;
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(function(r){r.showNotification("Sayeh Connect",{body:body,icon:"icons/icon-192.png",badge:"icons/icon-192.png"})}).catch(function(){});
}
function enableNotif(){
  if(!("Notification" in window)){toast("Notifications non disponibles sur cet appareil");return}
  Notification.requestPermission().then(function(p){toast(p==="granted"?"Notifications activées":"Notifications refusées")});
}
function registerSW(){if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})}

/* ---------- événements ---------- */
document.addEventListener("click",function(e){
  var t=e.target;
  var el;
  if((el=t.closest("[data-start]"))){writeSeen();seen=true;go("home");return}
  if((el=t.closest("[data-nav]"))){go(el.dataset.nav);return}
  if((el=t.closest("[data-back]"))){go(ui.from||"home");return}
  if((el=t.closest("[data-fav]"))){e.stopPropagation();toggleFav(el.dataset.fav);render();return}
  if((el=t.closest("[data-open]"))){ui.from=ui.view;go("detail",{detail:el.dataset.open});return}
  if((el=t.closest("[data-zone]"))){ui.zone=el.dataset.zone;render();return}
  if((el=t.closest("[data-ct]"))){ui.ct=el.dataset.ct;render();return}
  if((el=t.closest("[data-apply]"))){
    var o=offerById(el.dataset.apply);
    if(o&&!appFor(o.id)){addContact({name:o.c,country:o.k,offer:o.t,notes:"Postulé via : "+o.how,offerId:o.id});toast("Candidature enregistrée");setTimeout(render,0)}
    return; /* le lien s'ouvre dans un nouvel onglet */
  }
  if((el=t.closest("[data-skip]"))){state.dismissed.push(el.dataset.skip);persist();toast("Offre ignorée");go(ui.from||"home");return}
  if((el=t.closest("[data-goapps]"))){go("msg",{msgTab:"apps",filter:"all"});return}
  if((el=t.closest("[data-mtab]"))){ui.msgTab=el.dataset.mtab;render();return}
  if((el=t.closest("[data-toggleadd]"))){ui.addOpen=!ui.addOpen;render();return}
  if((el=t.closest("[data-toggleman]"))){ui.manOpen=!ui.manOpen;render();return}
  if(t.closest("[data-notif]")){enableNotif();return}
  if((el=t.closest("[data-filter]"))){ui.filter=el.dataset.filter;render();return}
  if((el=t.closest("[data-lang]"))){ui.tplLang=el.dataset.lang;render();return}
  if((el=t.closest("[data-key]"))){ui.tplKey=el.dataset.key;render();return}
  if(t.id==="copyBody"){copyText($("t-body").value,$("t-body"));return}
  if(t.id==="copySubject"){copyText($("t-subject").value,$("t-subject"));return}
  if((el=t.closest("[data-open-sec]"))){
    var k=el.dataset.openSec;
    if(k==="apps"){go("msg",{msgTab:"apps",filter:"all"});return}
    if(k==="favs"){go("fav");return}
    ui.open=ui.open===k?"":k;render();return;
  }
  var b=t.closest("[data-act]"),cEl=b&&b.closest("[data-id]");
  if(b&&cEl&&b.tagName!=="SELECT"){
    var c=state.contacts.filter(function(x){return x.id===cEl.dataset.id})[0];if(!c)return;
    var act=b.dataset.act;
    if(act==="followup"){c.followups=(c.followups||0)+1;c.lastFollow=Date.now();persist();render();toast("Relance enregistrée")}
    if(act==="archive"){c.status="archived";c.statusAt=Date.now();persist();render()}
    if(act==="del"){state.contacts=state.contacts.filter(function(x){return x!==c});persist();render()}
    if(act==="tpl"){ui.tplContactName=c.name;ui.tplCompany=c.name;ui.tplRole=c.offer||ui.tplRole;ui.tplKey=(c.followups||dueInfo(c))?"follow":"first";go("msg",{msgTab:"tpl"})}
  }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;
  var a=e.target.closest&&e.target.closest("article[data-open]");
  if(a&&e.target===a){e.preventDefault();ui.from=ui.view;go("detail",{detail:a.dataset.open})}
});
document.addEventListener("change",function(e){
  var s=e.target;
  if(s.matches&&s.matches("select[data-act=status]")){
    var c=state.contacts.filter(function(x){return x.id===s.closest("[data-id]").dataset.id})[0];if(!c)return;
    c.status=s.value;c.statusAt=Date.now();persist();render();return;
  }
  if(s.id==="s-remind"){state.remind=parseInt(s.value,10)||5;persist();render()}
});
document.addEventListener("submit",function(e){
  if(e.target.id==="manForm"){e.preventDefault();addManual();return}
  if(e.target.id!=="addForm")return;e.preventDefault();
  addContact({name:$("f-name").value.trim(),country:$("f-country").value.trim(),phone:$("f-phone").value.trim(),offer:$("f-offer").value.trim(),notes:$("f-notes").value.trim()});
  ui.addOpen=false;render();toast("Enregistré avec la date et l'heure");
});
var pTimer;
document.addEventListener("input",function(e){
  var id=e.target.id;
  if(id==="q"){ui.q=e.target.value;$("list").innerHTML=listHtml();return}
  if(id==="t-contact"){ui.tplContactName=e.target.value;refreshTpl();return}
  if(id==="t-company"){ui.tplCompany=e.target.value;refreshTpl();return}
  if(id==="t-role"){ui.tplRole=e.target.value;refreshTpl();return}
  var map={"p-name":"name","p-title":"title","p-city":"city","p-phone":"phone","p-email":"email","p-portfolio":"portfolio","p-cv":"cv"};
  if(map[id]){
    state.profile[map[id]]=e.target.value;
    var pct=profileScore(),bar=document.querySelector(".prog i");
    if(bar){bar.style.width=pct+"%";bar.parentNode.setAttribute("aria-valuenow",pct);bar.parentNode.previousElementSibling.lastChild.textContent=pct+"%"}
    clearTimeout(pTimer);pTimer=setTimeout(persist,600);
  }
});

/* ---------- démarrage ---------- */
seen=readSeen();
ui.view=seen?"home":"splash";
render();
function boot(s){
  store=s;
  s.load().then(function(d){
    if(d){
      state.contacts=d.contacts||[];state.dismissed=d.dismissed||[];state.favs=(d.favs||[]).filter(function(f){return f&&typeof f==="object"});state.manual=d.manual||[];state.seen=d.seen||[];
      if(d.profile)for(var k in d.profile)state.profile[k]=d.profile[k];
      else if(d.me)state.profile.name=d.me;
      if(d.remind)state.remind=d.remind;
    }
    var typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(!typing)render();
  }).catch(function(){});
}
boot(localStore());
loadJobs();
registerSW();
})();
</script>

</body></html>
